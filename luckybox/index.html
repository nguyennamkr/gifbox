<!DOCTYPE html><html lang="vi"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bốc thăm trúng thưởng</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script><style>@import url(https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900;600&display=swap);body{font-family:Inter,sans-serif;background-color:#0d1a26;display:flex;justify-content:center;align-items:center;min-height:100vh;color:#fff;overflow:hidden}.container{max-width:900px;width:95%;padding:2rem;text-align:center;background-color:#1a2a38;border-radius:1.5rem;box-shadow:0 15px 30px rgba(0,0,0,.5)}.number-display{display:flex;justify-content:center;gap:.5rem;margin:2rem 0;perspective:500px}.slot{width:12vw;max-width:80px;height:150px;overflow:hidden;border-radius:.5rem;background-color:#0b3d68;box-shadow:inset 0 0 10px rgba(0,0,0,.8);border:2px solid #3b82f6;position:relative}@media (max-width:640px){.slot{width:10vw;height:80px}}.roll{transition:transform .1s ease-in-out;will-change:transform;position:absolute;width:100%;display:flex;flex-direction:column;align-items:center}.digit{height:150px;display:flex;justify-content:center;align-items:center;font-size:4rem;font-weight:900;color:#fcd34d;text-shadow:0 0 10px rgba(252,211,77,.8);width:100%}@media (max-width:640px){.digit{height:80px;font-size:2rem}}.spin-button{padding:1rem 3rem;margin-top:2rem;background-image:linear-gradient(to right,#10b981,#059669);color:#fff;font-weight:900;font-size:1.5rem;border:none;border-radius:9999px;cursor:pointer;box-shadow:0 10px 20px rgba(16,185,129,.4);transition:all .3s ease-in-out}.spin-button:hover:not(:disabled){background-image:linear-gradient(to right,#059669,#047857);transform:translateY(-3px) scale(1.02)}.spin-button:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}.result-box{margin-top:2rem;padding:1.5rem;border-radius:.75rem;min-height:100px;display:flex;flex-direction:column;justify-content:center;align-items:center;background-color:#2b3b4a;box-shadow:0 5px 15px rgba(0,0,0,.3)}.winner-name{font-size:2rem;font-weight:800;color:#3b82f6;margin-top:.5rem;animation:pulse 1s infinite alternate}.code-title{font-size:1.25rem;font-weight:600;color:#9ca3af}@keyframes pulse{from{transform:scale(1);opacity:1}to{transform:scale(1.05);opacity:.9}}.gift-box-huge{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:25vw;max-width:90vh;animation:bounce 1s infinite;transition:all .5s ease-in-out;cursor:pointer;z-index:999;text-shadow:0 0 50px rgba(255,255,0,.8)}.gift-box-huge:hover{transform:translate(-50%,-50%) scale(1.05)}@keyframes bounce{0%,100%,20%,50%,80%{transform:translate(-50%,-50%) translateY(0)}40%{transform:translate(-50%,-50%) translateY(-20px)}60%{transform:translate(-50%,-50%) translateY(-10px)}}.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background-color:rgba(0,0,0,.7);display:flex;justify-content:center;align-items:center;z-index:1000}.modal-content{background-color:#1a2a38;padding:2rem;border-radius:1rem;max-width:450px;width:90%;text-align:center;box-shadow:0 0 25px rgba(59,130,246,.5);border:3px solid #3b82f6;transform:scale(.9);animation:modal-open .3s forwards ease-out}@keyframes modal-open{to{transform:scale(1)}}.modal-title{font-size:1.75rem;font-weight:900;color:#fcd34d;margin-bottom:1rem;text-shadow:0 0 5px rgba(252,211,77,.8)}.modal-prize-text{font-size:1.25rem;color:#fff;margin-bottom:1.5rem;line-height:1.5;font-style:italic}.modal-close-button{padding:.75rem 2rem;background-color:#3b82f6;color:#fff;font-weight:700;border-radius:9999px;transition:background-color .2s}.modal-close-button:hover{background-color:#2563eb}</style><body class="bg-gray-900"><div class="container"><h1 class="text-3xl md:text-4xl font-extrabold text-blue-400 mb-4 tracking-tight">RÚT LÀ TRÚNG ^^</h1><p class="text-lg text-gray-400">Nhân viên may mắn<div id="numberDisplay" class="number-display"></div><button id="spinBtn" class="spin-button">BẮT ĐẦU RÚT THĂM</button><div id="resultBox" class="result-box hidden"><p class="code-title">CHÚC MỪNG NHÂN VIÊN:<div class="flex items-center justify-center gap-4"><div id="resultMessage" class="text-3xl md:text-5xl font-extrabold text-yellow-400"></div></div><p class="winner-name" id="winnerName"></div></div><div id="giftBox" class="gift-box-huge cursor-pointer hidden" title="Bấm để nhận quà">🎁</div><div id="giftModal" class="modal-overlay hidden"><div class="modal-content"><h3 class="modal-title">CHÚC MỪNG BẠN ĐÃ TRÚNG THƯỞNG!</h3><p class="modal-prize-text">Phần thưởng của bạn là mỗi tuần sẽ có hẹn với 1 người tên chữ cái đầu giống chữ cái đầu trong tên bạn và sẽ nhận được bất ngờ từ người ấy ^^</p><button id="closeModalBtn" class="modal-close-button">ĐÓNG</button></div></div><script type="module">const WINNING_ID="16762639",WINNER_NAME="Nguyễn Thị Thanh Nhàn",NUM_DIGITS=8,SLOT_HEIGHT=150,SPIN_DURATION_MS=4e3,DELAY_PER_SLOT_MS=300,numberDisplay=document.getElementById("numberDisplay"),spinBtn=document.getElementById("spinBtn"),resultBox=document.getElementById("resultBox"),resultMessage=document.getElementById("resultMessage"),winnerNameEl=document.getElementById("winnerName"),giftBox=document.getElementById("giftBox"),giftModal=document.getElementById("giftModal"),closeModalBtn=document.getElementById("closeModalBtn");let rolls=[],spinIntervalId=null;const bitCrusher=new Tone.BitCrusher(4).toDestination(),spinSound=new Tone.MetalSynth({frequency:100,envelope:{attack:.001,decay:.05,release:.01},harmonicity:3.1,modulationIndex:30,resonance:4e3,octaves:1.5}).connect(bitCrusher);function playSpinSound(){const e=Tone.Midi(5*Math.random()+40).toFrequency();spinSound.frequency.setValueAtTime(e,Tone.now()),spinSound.triggerAttackRelease(.01,.5)}const winSynth=new Tone.MembraneSynth({pitchDecay:.008,octaves:2,envelope:{attack:.001,decay:.8,sustain:.01,release:.9,attackCurve:"exponential"}}).toDestination(),winJingle=["G4","C5","E5"];function playWinJingle(){winJingle.forEach((e,t)=>{const n=t===winJingle.length-1?1:.8;winSynth.triggerAttackRelease(e,"4n",Tone.now()+.2*t,n)})}function showGiftModal(){giftModal.classList.remove("hidden")}function hideGiftModal(){giftModal.classList.add("hidden")}function initializeSlots(){numberDisplay.innerHTML="",rolls=[];for(let e=0;e<8;e++){const e=document.createElement("div");e.classList.add("slot");const t=document.createElement("div");t.classList.add("roll");let n="";const i=30;for(let e=0;e<i;e++)for(let e=0;e<=9;e++)n+=`<div class="digit">${e}</div>`;t.innerHTML=n,e.appendChild(t),numberDisplay.appendChild(e),rolls.push(t)}}async function startLottery(){"running"!==Tone.context.state&&await Tone.start(),spinBtn.disabled=!0,spinBtn.textContent="ĐANG RÚT THĂM...",resultBox.classList.add("hidden"),giftBox.classList.add("hidden"),spinIntervalId||(spinIntervalId=setInterval(playSpinSound,50));const e=rolls[0].querySelector(".digit"),t=e?e.offsetHeight:150;rolls.forEach((e,n)=>{const i=-(250+parseInt("16762639"[n]))*t,s=4e3+300*n;e.style.transition="transform 0.1s linear",e.style.transform=`translateY(${i+30*t}px)`,setTimeout(()=>{e.style.transition=`transform ${s/1e3}s cubic-bezier(0.2, 0.9, 0.4, 1)`,e.style.transform=`translateY(${i}px)`},50),7===n&&setTimeout(showResult,s)})}function showResult(){spinIntervalId&&(clearInterval(spinIntervalId),spinIntervalId=null),playWinJingle(),spinBtn.disabled=!1,spinBtn.textContent="RÚT THĂM LẠI",resultMessage.textContent="16762639",winnerNameEl.textContent=`🎉 ${WINNER_NAME} 🎉`,resultBox.classList.remove("hidden"),giftBox.classList.remove("hidden")}initializeSlots(),spinBtn.addEventListener("click",startLottery),giftBox.addEventListener("click",showGiftModal),closeModalBtn.addEventListener("click",hideGiftModal),giftModal.addEventListener("click",e=>{e.target===giftModal&&hideGiftModal()})</script>
